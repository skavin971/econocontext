[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-db"
version = "0.1.0"
description = "One agent's context on Postgres (a trimmed copy; CHANGES.md)"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
local = ["pgserver>=0.1.4"]           # a Postgres that runs from pip, no Docker
dev = ["pytest>=8", "pgserver>=0.1.4"]

[tool.setuptools.packages.find]
include = ["agent_db*"]

[tool.setuptools.package-data]
agent_db = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
