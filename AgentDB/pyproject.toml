[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-db"
version = "0.1.0"
description = "A Postgres Agent DB built to EconoContext's AGENT_DB_CONTRACT.md"
requires-python = ">=3.11"
# The segment, agent, decision and usage records come from econocontext.types; install
# econocontext (the worktree beside this package) into the same environment.
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
local = ["pgserver>=0.1.4"]           # a Postgres that runs from pip, no Docker
neo4j = ["neo4j>=5"]
dev = ["pytest>=8", "pgserver>=0.1.4", "neo4j>=5"]

[tool.setuptools.packages.find]
include = ["agent_db*"]

[tool.setuptools.package-data]
agent_db = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
