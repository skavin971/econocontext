[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econocontext"
version = "0.3.0.dev0"
description = "A cost-based optimizer for LLM agent systems"
requires-python = ">=3.11"
# The method (econocontext/) needs only PyYAML. harness/ runs inside Harbor (installed in .venv).
# Earlier tracks (at tag econo-jev-final) keep their own dependencies.
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# measure/ rebuilds prompts with the model's own tokenizer and chat template.
measure = ["transformers==5.19.0"]
# EconoContext keeps its context in the agent DB (AgentDB/, installed with pip install -e AgentDB):
# Postgres through psycopg; tests start their own Postgres with pgserver (no Docker).
agentdb = ["psycopg[binary]==3.3.6", "pgserver==0.1.4"]

[tool.setuptools.packages.find]
include = ["econocontext*", "harness*", "baselines*", "gateway*", "measure*"]

[tool.pytest.ini_options]
testpaths = ["tests", "AgentDB/tests"]
pythonpath = ["."]
markers = [
  "live: real paid calls (needs credentials); run with -m live",
]
addopts = "-m 'not live'"
