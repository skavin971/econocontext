[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econocontext"
version = "0.3.0.dev0"
description = "A cost-based optimizer for LLM agent systems"
requires-python = ">=3.11"
# The method (econocontext/) needs only PyYAML. agents/ runs inside Harbor (installed in .venv).
# Archived tracks (archive/) keep their own dependencies.
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["econocontext*", "agents*", "gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: real paid calls (needs credentials); run with -m live",
  "docker: needs Docker and a pulled SWE-bench image, but no model calls",
]
addopts = "-m 'not live'"
