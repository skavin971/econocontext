[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econocontext"
version = "0.1.0"
description = "Deterministic operation planning and measured execution for local agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
econocontext = "econocontext.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The schema and the agent fixtures are not Python. Without this they survive an
# editable install and vanish from a real one.
[tool.setuptools.package-data]
econocontext = ["**/*.sql"]
agents = ["**/fixtures/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Fixtures are task material, not source. A formatter that "fixes" one can
# change the defect an agent is supposed to find, or the hidden check that
# proves it did.
exclude = ["src/agents/*/fixtures/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
