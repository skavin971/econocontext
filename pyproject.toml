[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "econocontext"
version = "0.3.0.dev0"
description = "A cost-based optimizer for LLM agent systems"
requires-python = ">=3.11"
# The optimizer needs only PyYAML. The Omnigent layer (omnigent_layer/) and the SWE-bench
# bench (bench/) have their own dependencies; see docs/TESTING.md.
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
bench = ["swebench==5.0.2"]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["econocontext*"]

[tool.setuptools.package-data]
econocontext = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: real paid calls (needs credentials); run with -m live",
  "docker: needs Docker and a pulled SWE-bench image, but no model calls",
]
addopts = "-m 'not live'"
