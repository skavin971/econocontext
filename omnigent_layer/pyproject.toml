[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-econocontext"
version = "0.1.0.dev0"
description = "The Omnigent layer for EconoContext: a policy and a model-call gateway"
requires-python = ">=3.12"
# econocontext is installed from the repo root (pip install -e .); Omnigent is pinned:
# policy.py reads its event fields, which change between alpha releases.
dependencies = ["econocontext", "omnigent==0.15.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnigent_layer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
