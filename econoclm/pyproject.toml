[project]
name = "econoclm"
version = "0.1.0"
description = "EconoCLM v1: CLM (Context Language Models) plus exact memory, live cache/cost facts and stale-file flags."
requires-python = ">=3.12,<3.14"
# The CLM package (pip install -e ../context-language-models) must be installed
# first. It is CC BY-NC 4.0: we import it, never copy its code.
dependencies = ["clm", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This folder IS the `econoclm` package.
[tool.setuptools]
package-dir = { "econoclm" = "." }
packages = [
  "econoclm", "econoclm.core", "econoclm.quote", "econoclm.arms",
  "econoclm.arms.econo_clm", "econoclm.arms.econo_clm_v11", "econoclm.arms.econo_view", "econoclm.bench",
  "econoclm.bench.tblite",
  "econoclm.analysis",
]

[tool.setuptools.package-data]
"econoclm.arms.econo_clm" = ["config.yaml", "skill/econo_db/*"]
"econoclm.arms.econo_clm_v11" = ["config.yaml", "skill/econo_db/*"]
"econoclm.arms" = ["econo_clm_v12/config.yaml", "econo_clm_v12/skill/econo_db/*"]
"econoclm.arms.econo_view" = ["config.yaml", "system_section.md", "skill/econo_db/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
