# EconoCLM arm. Identical to arms/raw_clm/config.yaml except `agent` and
# `skill_dirs` (a path relative to the econoclm/ folder; run.py makes it absolute).
# run.py also adds econo_run_dir (where this trial's econo.sqlite goes).

agent: econoclm.arms.econo_clm.agent:EconoClmAgent
model: openai/google/gemini-3.6-flash

agent_kwargs:
  context_budget_tokens: 32000
  max_tokens: 2048
  max_steps: 64
  command_timeout: 180
  temperature: 0.7
  top_p: 0.95
  send_chat_template_kwargs: false   # vLLM-only; Gemini rejects chat_template_kwargs
  cost_metric: usd                    # our gateway is the real cost source
  skill_dirs: arms/econo_clm/skill/econo_db
