# Raw CLM arm: CLM's unmodified ClmAgent. bench/tblite/run.py turns each
# agent_kwargs entry into --agent-kwarg key=value (like CLM's run_harbor.sh).
# Settings follow CLM's TBLite setup from the paper: 32K budget, 2,048 generated
# tokens per call, 64 turns, 180 s per command. Everything else: CLM's defaults.
# The ONLY differences in arms/econo_clm/config.yaml: `agent` and `skill_dirs`
# (plus econo_run_dir, which run.py adds; it only says where to write logs).

agent: clm_harness.clm_agent.harness:ClmAgent
model: openai/google/gemini-3.6-flash

agent_kwargs:
  context_budget_tokens: 32000
  max_tokens: 2048
  max_steps: 64
  command_timeout: 180
  temperature: 0.7
  top_p: 0.95
  send_chat_template_kwargs: false   # vLLM-only; Gemini rejects chat_template_kwargs
  cost_metric: usd                    # our gateway is the real cost source
